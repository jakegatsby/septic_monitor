services:
  prometheus:
    image: "prom/prometheus"
    ports:
    - "9090:9090"
    volumes:
    - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    - "prometheus:/prometheus"
    restart: unless-stopped

  grafana:
    image: "grafana/grafana-oss"
    env_file: .env
    volumes:
    - "grafana:/var/lib/grafana"
    restart: unless-stopped
    ports:
    - "3000:3000"
    depends_on:
    - "prometheus"

  syslog-ng:
    image: lscr.io/linuxserver/syslog-ng:latest
    container_name: syslog-ng
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Winnipeg
    ports:
      - "514:514/udp"
    restart: unless-stopped
    volumes:
      - ./syslog-ng.conf:/config/syslog-ng.conf:ro
      - ./syslog:/config/log/


